[project]
name = "arvore"
version = "0.0.7"
authors = [
  { name="Eachan Johnson", email="eachan.johnson@crick.ac.uk" },
]
description = "Reproducible tree-based machine learning."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = [
  "ai",
  "active-learning", 
  "bayesian-optimization",
  "data",
  "deep-learning",
  "machine-learning",
]

classifiers = [  
  
  "Development Status :: 3 - Alpha",

  # Indicate who your project is intended for
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",

  "License :: OSI Approved :: MIT License",

  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
  "aspect-data>=0.1.2",
  "carabiner-tools>=0.0.5.post3",
  "datasets>=3.5.0",
  "joblib>=1.3",
  "numpy>=2.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.7",
  "skops>=0.12",
]

[project.optional-dependencies]
chem = ["schemist>=0.1.2"]
bio = ["vectome>=0.0.7"]
cat = ["catboost>=1.2"]
lgbm = ["lightgbm[arrow,scikit-learn,plotting]>=4.0"]
xgb = ["xgboost_cpu"]
xgb_cuda12 = ["xgboost-cu12"]
xgb_cuda13 = ["xgboost>=3.0"]
trees = ["arvore[xgb,lgbm]"]
dev = ["arvore[chem,bio,trees]", "pytest>=7.4", "flake8"]

[project.urls]
"Homepage" = "https://github.com/scbirlab/arvore"
"Bug Tracker" = "https://github.com/scbirlab/arvore/issues"

[project.scripts] 
arvore = "arvore.cli.cli:main"

[tool.setuptools]
# If there are data files included in your packages that need to be
# installed, specify them here.
package-data = {"arvore" = [
  "data/*.json",
  "data/models/*.json"
]}

[build-system]
# These are the assumed default build requirements from pip:
# https://pip.pypa.io/en/stable/reference/pip/#pep-517-and-518-support
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[test]
deps = ["pytest>=7.4", "pytest-cov", "arvore[dev]"] 
