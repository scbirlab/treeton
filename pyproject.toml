[project]
name = "treeton"
version = "0.0. "
authors = [
  { name="Eachan Johnson", email="eachan.johnson@crick.ac.uk" },
]
description = "Tree learning infrastructure."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = [
  "ai",
  "active-learning", 
  "bayesian-optimization",
  "data",
  "deep-learning",
  "machine-learning",
]

classifiers = [  
  
  "Development Status :: 3 - Alpha",

  # Indicate who your project is intended for
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",

  "License :: OSI Approved :: MIT License",

  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
  "aspect-data>=0.0.6",
  "carabiner-tools[pd,mpl]>=0.0.5.post3",
  "datasets>=3.5.0",
  "dill>=0.3.9",
  "filelock",
  "huggingface_hub",
  "jsonargparse>=4.40",
  "numpy",
  "platformdirs>=4.4.0",
  "scikit-learn>=1.7",
  "scipy",
  "tqdm",
]

[project.optional-dependencies]
chem = ["schemist>=0.0.6"]
bio = ["vectome>=0.0.7"]
xgb = ["xgboost_cpu"]
xgb_cuda12 = ["xgboost-cu12"]
xgb_cuda13 = ["xgboost"]
dev = ["duvidnn[chem,bio,xgb]", "pytest>=7.4", "flake8"]

[project.urls]
"Homepage" = "https://github.com/scbirlab/treeton"
"Bug Tracker" = "https://github.com/scbirlab/treeton/issues"

[project.scripts] 
duvidnn = "treeton.cli.cli:main"

[tool.setuptools]
# If there are data files included in your packages that need to be
# installed, specify them here.
package-data = {"treeton" = [
  "data/*.json",
  "data/models/*.json"
]}

[build-system]
# These are the assumed default build requirements from pip:
# https://pip.pypa.io/en/stable/reference/pip/#pep-517-and-518-support
requires = ["setuptools>=43.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[test]
deps = ["pytest>=7.4", "pytest-cov", "duvidnn[dev]"] 
